apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: development

replicas:
  - name: example-app
    count: 5

patches:
  - target:
      kind: Deployment
      name: example-app
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: nginx:1.22-alpine