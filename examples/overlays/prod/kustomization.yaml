apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: production

replicas:
  - name: example-app
    count: 3

patches:
  - target:
      kind: Deployment
      name: example-app
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: nginx:1.24-alpine
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "200m"

  - target:
      kind: Service
      name: example-app
    patch: |
      - op: replace
        path: /spec/type
        value: LoadBalancer