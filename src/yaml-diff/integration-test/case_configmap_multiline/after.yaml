apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 8080
    database:
      host: prod-db.example.com
      port: 5432
    logging:
      level: info
  script.sh: |
    #!/bin/bash
    echo "Starting application"
    export PORT=8080
    export ENV=production
    exec java -jar app.jar