apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  servers: |
    - host: server1.example.com
      port: 8080
    - host: server2.example.com
      port: 8081
  features:
    - authentication
    - logging
    - metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.20
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx
        - name: data
          mountPath: /var/www
      volumes:
      - name: config
        configMap:
          name: nginx-config
      - name: data
        emptyDir: {}