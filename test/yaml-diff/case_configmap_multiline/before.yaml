apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  config.yaml: |
    server:
      host: localhost
      port: 8080
    database:
      host: db.example.com
      port: 5432
  script.sh: |
    #!/bin/bash
    echo "Starting application"
    export PORT=8080
    exec java -jar app.jar