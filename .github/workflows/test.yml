name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Setup mise
      uses: jdx/mise-action@v2
    - name: Install tools via mise
      run: mise install

    - name: Install dependencies
      run: bun install

    - name: Run tests
      run: bun test

    - name: Run CLI tests
      run: bun test:cli

    - name: Run unit tests
      run: bun test:unit