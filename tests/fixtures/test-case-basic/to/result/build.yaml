apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - env:
        - name: ENV
          value: production
        image: nginx:1.20
        name: app
        ports:
        - containerPort: 80